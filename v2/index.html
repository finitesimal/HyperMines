const shadertext_v_1 = `#version 300 es

precision highp float;
precision highp int;
precision highp sampler2D;
precision highp isampler2D;

layout(location = 0) in vec2 a_pos;
layout(location = 1) in vec4 a_quat;
layout(location = 2) in int a_idx;

uniform vec4 u_quat; //全局变换
uniform vec3 u_resolution; //宽度，高度，圆盘直径，单位像素
uniform isampler2D tex_state;

out vec2 v_pos;
out vec4 v_quat_inv;
out vec4 v_quat_move_inv;
out vec3 v_tex_pos;

vec4 quat_times(vec4 a, vec4 b){
    return vec4(
        a.x*b.x - a.y*b.y + a.z*b.z + a.w*b.w,
        a.x*b.y + a.y*b.x + a.w*b.z - a.z*b.w,
        a.x*b.z + a.z*b.x + a.w*b.y - a.y*b.w,
        a.x*b.w + a.w*b.x + a.y*b.z - a.z*b.y 
    );
}

vec2 quat_apply(vec4 q, vec2 p){
    float ar = p.x;
    float at = p.y;
    float ur = q.x * ar - q.y * at + q.z;
    float ut = q.x * at + q.y * ar + q.w;
    float dr = q.z * ar + q.w * at + q.x;
    float dt = q.z * at - q.w * ar - q.y;
    float d = dr * dr + dt * dt;
    return vec2(
        (ur * dr + ut * dt) / d,
        (ut * dr - ur * dt) / d
    );
}

vec2 quat_center(vec4 q){
    float ur = q.z;
    float ut = q.w;
    float dr = q.x;
    float dt = -q.y;
    float d = dr * dr + dt * dt;
    return vec2(
        (ur * dr + ut * dt) / d,
        (ut * dr - ur * dt) / d
    );
}

void main(){
    vec4 quat = quat_times(u_quat, a_quat);
    vec2 pos = quat_apply(quat, a_pos);
    int tex_idx = texelFetch(tex_state, ivec2(a_idx, 0), 0).x;
    v_pos = pos;
    v_quat_inv = quat * vec4(1, -1, -1, -1);
    v_quat_move_inv = length(quat.xy) * vec4(1, 0, -quat_center(quat));
    v_tex_pos = vec3(vec2(tex_idx % 4, (tex_idx % 16) / 4) * 0.25 + vec2(0.125), tex_idx / 16);
    gl_Position = vec4(pos * u_resolution.z / u_resolution.xy, 0.0, 1.0);
}
`

const shadertext_f_1 = `#version 300 es

precision highp float;
precision highp int;
precision highp sampler2D;
precision highp isampler2D;

in vec2 v_pos;
in vec4 v_quat_inv;
in vec4 v_quat_move_inv;
in vec3 v_tex_pos;

uniform vec3 u_resolution;
uniform vec2 u_param; //角度，边界距离
uniform sampler2D tex_number;

out vec4 out_color;

vec2 quat_apply(vec4 q, vec2 p){
    float ar = p.x;
    float at = p.y;
    float ur = q.x * ar - q.y * at + q.z;
    float ut = q.x * at + q.y * ar + q.w;
    float dr = q.z * ar + q.w * at + q.x;
    float dt = q.z * at - q.w * ar - q.y;
    float d = dr * dr + dt * dt;
    return vec2(
        (ur * dr + ut * dt) / d,
        (ut * dr - ur * dt) / d
    );
}

void main(){
    // 多边形中心变换到圆盘中心后的位置
    vec2 center_pos = quat_apply(v_quat_inv, v_pos);
    // 计算在第几条边附近
    float theta = atan(center_pos.y, center_pos.x);
    float dtheta = -u_param.x * round(theta / u_param.x);
    float dthetac = cos(dtheta); float dthetas = sin(dtheta);
    // 旋转到正右方那条边附近
    vec2 fan_pos = vec2(dthetac * center_pos.x - dthetas * center_pos.y, dthetas * center_pos.x + dthetac * center_pos.y);
    // 向左移动边界距离后的位置
    vec2 border_pos = quat_apply(vec4(1, 0, -u_param.y, 0), fan_pos);
    // 像素长度对应的双曲距离，抗锯齿用
    float pixel_to_hyperbolic = 2.0 / u_resolution.z * 2.0 / (1.0 - dot(v_pos, v_pos));
    // 像素长度对应在fan_pos处的长度，采用近似公式
    // float pixel_to_border = pixel_to_hyperbolic * (1.0 - dot(border_pos, border_pos)) / 2.0;
    float pixel_to_border = 0.5 * pixel_to_hyperbolic;
    // 多边形中心变换到圆盘中心并且不旋转后的位置
    vec2 tex_pos = quat_apply(v_quat_move_inv, v_pos);
    // 纹理采样以及高亮
    vec3 color = texture(tex_number, clamp(tex_pos / u_param.y * 0.1, -0.11, 0.11) + v_tex_pos.xy).rgb;
    if(v_tex_pos.z > 0.5){
        color = mix(color, vec3(0xf1, 0xf5, 0xf9) / 255.0, 0.4);
    }
    // 计算边界与抗锯齿
    float lerp = smoothstep(-pixel_to_border, 0., border_pos.x);
    color = mix(color, vec3(0xcb, 0xd5, 0xe1) / 255.0, lerp);
    out_color = vec4(color, 1);
}
`


function create_shader(gl, type, source){
    const shader = gl.createShader(type)
    gl.shaderSource(shader, source)
    gl.compileShader(shader)
    const success = gl.getShaderParameter(shader, gl.COMPILE_STATUS)
    if(success){
        return shader
    }
    console.log(gl.getShaderInfoLog(shader))
    gl.deleteShader(shader)
}

function create_program(gl, vertexShader, fragmentShader){
    const program = gl.createProgram()
    gl.attachShader(program, vertexShader)
    gl.attachShader(program, fragmentShader)
    gl.linkProgram(program)
    const success = gl.getProgramParameter(program, gl.LINK_STATUS)
    if(success){
        return program
    }
    console.log(gl.getProgramInfoLog(program))
    gl.deleteProgram(program)
}

            a.r * b.y + a.y * b.r + a.z * b.x - a.x * b.z,
            a.r * b.z + a.z * b.r + a.x * b.y - a.y * b.x

    }
    inv_apply(a){
        const q = this
        const [ar, at] = a
        const ur = q.r * ar + q.x * at - q.y
        const ut = q.r * at - q.x * ar - q.z
        const dr =-q.y * ar - q.z * at + q.r
        const dt =-q.y * at + q.z * ar + q.x
        const d = dr * dr + dt * dt
        return [
            (ur * dr + ut * dt) / d,
            (ut * dr - ur * dt) / d
        ]
    }
    toArray(){
        return [this.r, this.x, this.y, this.z]
    }
    static rotate(t){
        return new Quat(Math.cos(t / 2), Math.sin(t / 2), 0, 0)
    }
    static move(t){
        return new Quat(Math.cosh(t / 2), 0, Math.sinh(t / 2), 0)
    }
    static move_to(a){
        const [x, y] = a
        const l = Math.sqrt(1 - x * x - y * y)
        return new Quat(1 / l, 0, x / l, y / l)
    }
    static move_from(a){
        const [x, y] = a
        const l = Math.sqrt(1 - x * x - y * y)
        return new Quat(1 / l, 0, -x / l, -y / l)
    }
    static move_from_to(c1, c2){
        return Quat.move_to(c2).times(Quat.move_from(c1))
    }
    static poincare_to_klein(a){
        const [ax, ay] = a
        const s = 2 / (1 + ax ** 2 + ay ** 2)
        return [s * ax, s * ay]
    }
    static klein_to_poincare(a){
        const [ax, ay] = a
        const s = 1 / (1 + Math.sqrt(1 - ax ** 2 - ay ** 2))
        return [s * ax, s * ay]
    }
    static hyperbolic_dist(a, b){
        const [ax, ay] = a
        const [bx, by] = b
        const d2 = (ax - bx) ** 2 + (ay - by) ** 2
        const na = 1 - ax ** 2 - ay ** 2
        const nb = 1 - bx ** 2 - by ** 2
        return Math.acosh(Math.max(1, 1 + 2 * d2 / (na * nb)))
    }
}

class Perm{
    constructor(array){
        this.perm = typeof array === "string" ? array.split(",").map(x => parseInt(x)) : array
        this.n = this.perm.length
    }
    times(other){
        const res = new Array(this.n)
        for(let i = 0; i < this.n; i++){
            res[i] = this.perm[other.perm[i]]
        }
        return new Perm(res)
    }
    inv(){
        const res = new Array(this.n)
        for(let i = 0; i < this.n; i++){
            res[this.perm[i]] = i
        }
        return new Perm(res)
    }
    order(){
        let x = this
        let i = 1
        while(!x.isIdentity()){
            i++
            x = x.times(this)
        }
        return i
    }
    isIdentity(){
        return this.perm.every((x, i) => x === i)
    }
    toString(){
        return this.perm.join(",")
    }
    static identity(n){
        if(typeof n !== "number"){
            n = n.n
        }
        const res = new Array(n)
        for(let i = 0; i < n; i++){
            res[i] = i
        }
        return new Perm(res)
    }
}

class PoincareHash{
    constructor(){
        this.map = new Map()
        this.epsilon = 1e-10
    }
    get_key(p){
        const [px, py] = p
        const r = Math.hypot(px, py)
        const t = Math.atan2(py, px)
        const key1 = Math.round(-Math.log2(1 - r))
        if(!Number.isFinite(key1) || key1 <= 0){
            return "0"
        }
        const num = 2 ** key1 * 6
        const key2 = (Math.floor((t / (2 * Math.PI)) * num + 0.6180339887498949) + num) % num
        return key1 + "," + key2
    }
    add(p, item){
        const key = this.get_key(p)
        if(!this.map.has(key)){
            this.map.set(key, [{
                p: p, item: item
            }])
            return true
        }else{
            const [x, y] = p
            const lst = this.map.get(key)
            for(const {p: p1} of lst){
                const [x1, y1] = p1
                if((x1 - x) ** 2 + (y1 - y) ** 2 < this.epsilon ** 2){
                    return false
                }
            }
            lst.push({
                p: p, item: item
            })
            return true
        }
    }
    list(){
        return Array.from(this.map.values()).flat().map(x => x.item)
    }
}

// 给三角形三个角计算三边长
function angle_to_length(A, B, C){
    const cosA = Math.cos(A)
    const cosB = Math.cos(B)
    const cosC = Math.cos(C)
    const sinA = Math.sin(A)
    const sinB = Math.sin(B)
    const sinC = Math.sin(C)
    const cosh_a = (cosA + cosB * cosC) / (sinB * sinC)
    const cosh_b = (cosB + cosC * cosA) / (sinC * sinA)
    const cosh_c = (cosC + cosA * cosB) / (sinA * sinB)
    return [Math.acosh(cosh_a), Math.acosh(cosh_b), Math.acosh(cosh_c)]
}

// 根据几个生成元找出商群所有群元素
// ops 是局部变换，右乘
function get_quotient_group(ops){
    const identity = Perm.identity(ops[0])
    const queue = [identity]
    const res = new Set()
    res.add(identity.toString())
    while(queue.length !== 0){
        const x = queue.shift()
        for(const op of ops){
            const y = x.times(op)
            const s = y.toString()
            if(!res.has(s)){
                res.add(s)
                queue.push(y)
            }
        }
    }
    return res
}

// 把群元素映射到某个商曲面元素上，op的作用使得顶点不变，idx是起始编号
// op是局部变换，右乘
function get_quotient_element(group, op, idx){
    const order = op.order()
    const map = new Map()
    for(const s of group){
        if(map.has(s)){
            continue
        }
        map.set(s, idx)
        let x = new Perm(s)
        for(let i = 1; i < order; i++){
            x = x.times(op)
            map.set(x.toString(), idx)
        }
        idx++
    }
    return [map, idx]
}

// 找出商曲面的邻居，对于不同类型商曲面元素双向记录
// op是局部变换，右乘
function get_quotient_neighbor(neighbor_lst, map_a, map_b, op){
    if(map_a === map_b){
        for(const [s, idx1] of map_a){
            const idx2 = map_b.get(new Perm(s).times(op).toString())
            neighbor_lst[idx1].push(idx2)
        }
    }else{
        for(const [s, idx1] of map_a){
            const idx2 = map_b.get(new Perm(s).times(op).toString())
            neighbor_lst[idx1].push(idx2)
            neighbor_lst[idx2].push(idx1)
        }
    }
}

// 找出商曲面元素变换后对应的顶点
// op是全局变换，左乘
function get_quotient_transform(transform_lst, map, op){
    for(const [s, idx1] of map){
        const idx2 = map.get(op.times(new Perm(s)).toString())
        transform_lst[idx1] = idx2
    }
}

// 找出几何三角群与对应商群元素
// geo_ops 是几何群局部变换
// quo_ops 是商群局部变换
// vertex 是使用的判定点坐标
function get_geometry_group(geo_ops, quo_ops, vertex, lim){
    const hash = new PoincareHash()
    const identity = [new Quat(), Perm.identity(quo_ops[0])]
    const queue = [identity]
    hash.add(identity[0].apply(vertex), [identity[0], identity[1].toString()])
    while(queue.length !== 0){
        const [qx, gx] = queue.shift()
        for(let i = 0; i < geo_ops.length; i++){
            const qy = qx.times(geo_ops[i])
            const gy = gx.times(quo_ops[i])
            const p = qy.apply(vertex)
            if(p[0] ** 2 + p[1] ** 2 < lim ** 2 && hash.add(p, [qy, gy.toString()])){
                queue.push([qy, gy])
            }
        }
    }
    return hash.list()
}

// 几何群映射到特定的顶点上, 对应的商群也映射到对应顶点
function get_geometry_quotient(list, map, vertex, lim){
    const hash = new PoincareHash()
    for(const [q, s] of list){
        const p = q.apply(vertex)
        if(p[0] ** 2 + p[1] ** 2 < lim ** 2){
            hash.add(p, [q, map.get(s)])
        }
    }
    return hash.list()
}

// 计算4466铺砌的几何参数
function compute_4466_geometry(){
    const ver_a = [0, 0]
    const geo_a = Quat.rotate(Math.PI * 2 / 3)
    const [lbp, lap, lab] = angle_to_length(Math.PI / 6, Math.PI / 4, Math.PI / 2)
    const ver_b = Quat.move(lab).center()
    const geo_b = Quat.move(lab).times(Quat.rotate(Math.PI)).times(Quat.move(-lab))
    const ver_p = Quat.rotate(Math.PI / 6).times(Quat.move(lap)).center()
    const ver_p_klein = Quat.poincare_to_klein(ver_p)
    const ver_q = Quat.klein_to_poincare([ver_p_klein[0], 0])
    const ver_d = Quat.rotate(Math.PI / 3).apply(ver_q)
    const geo_d = Quat.move_to(ver_d).times(Quat.rotate(Math.PI)).times(Quat.move_from(ver_d))
    const geo_c = geo_d.times(geo_a).times(geo_b).inv()
    return {geo_a, geo_b, geo_c, geo_d, ver_a, ver_b, ver_q}
}

// 计算4466铺砌的商曲面几何性质
function compute_4466(lst){
    const t = Date.now()

    const quo_a = new Perm(lst[0])
    const quo_b = new Perm(lst[1])
    const quo_c = new Perm(lst[2])
    const quo_d = new Perm(lst[3])
    const quo_i = Perm.identity(quo_a)

    // 计算群元素，找出群元素到每个顶点的映射
    const quotient_group = get_quotient_group([quo_a, quo_b, quo_c, quo_d])
    const [quotient_element_map_a, num_temp_1] = get_quotient_element(quotient_group, quo_a, 0)
    const [quotient_element_map_b, num_vertex] = get_quotient_element(quotient_group, quo_b, num_temp_1)
    
    // 计算每个顶点的邻居
    const quotient_neighbor = new Array(num_vertex).fill(0).map(() => [])
    get_quotient_neighbor(quotient_neighbor, quotient_element_map_a, quotient_element_map_a, quo_d)
    get_quotient_neighbor(quotient_neighbor, quotient_element_map_a, quotient_element_map_b, quo_i)
    get_quotient_neighbor(quotient_neighbor, quotient_element_map_a, quotient_element_map_b, quo_c)
    get_quotient_neighbor(quotient_neighbor, quotient_element_map_a, quotient_element_map_b, quo_d)
    get_quotient_neighbor(quotient_neighbor, quotient_element_map_b, quotient_element_map_b, quo_c)

    // 计算每个顶点在不同全局变换下变换到的顶点
    const quotient_transform = []
    for(const op of [quo_a, quo_b, quo_c, quo_d, quo_a.inv()]){
        const res = new Array(num_vertex).fill(-1)
        get_quotient_transform(res, quotient_element_map_a, op)
        get_quotient_transform(res, quotient_element_map_b, op)
        quotient_transform.push(res)
    }

    // 计算几何参数
    const {geo_a, geo_b, geo_c, geo_d, ver_a, ver_b, ver_q} = compute_4466_geometry()

    // 计算几何群，对应的顶点，以及商群顶点编号
    const lim = 0.999
    const geometry_group = get_geometry_group([geo_a, geo_b, geo_c, geo_d], [quo_a, quo_b, quo_c, quo_d], ver_q, lim)
    const geometry_quotient_a = get_geometry_quotient(geometry_group, quotient_element_map_a, ver_a, lim)
    const geometry_quotient_b = get_geometry_quotient(geometry_group, quotient_element_map_b, ver_b, lim)

    const r_a = Quat.hyperbolic_dist(ver_a, ver_q)
    const r_b = Quat.hyperbolic_dist(ver_b, ver_q)
    const setup_b = Quat.move_to(ver_b)
    const tile_quotient_a = geometry_quotient_a
    const tile_quotient_b = geometry_quotient_b.map(pair => [pair[0].times(setup_b), pair[1]])

    const tile_op = [geo_a, geo_b, geo_c, geo_d, geo_a.inv()]

    return {
        quotient_neighbor,
        quotient_transform,
        tile_op,
        tile_quotient: [tile_quotient_a, tile_quotient_b],
        radius: [r_a, r_b],
        side: [6, 4]
    }
}

// 计算一个给定半径和边数的双曲正多边形mesh
function compute_mesh(radius, side, division){
    const theta = Math.PI / side
    const half_edge = Math.atanh(Math.sinh(radius) * Math.tan(theta))
    const mesh = [[0, 0]]
    for(let s = 0; s < side; s++){
        const base = Quat.rotate(s * 2 * theta).times(Quat.move(radius)).times(Quat.rotate(Math.PI / 2))
        for(let i = 0; i < division; i++){
            const v = base.times(Quat.move((2 * i / division - 1) * half_edge)).center()
            mesh.push(v)
        }
    }
    mesh.push(mesh[1])
    return mesh
}

// 给定邻接表的扫雷
class Minesweeper {
    constructor(adjList, mine_num) {
        this.adj = adjList
        this.totalGrid = adjList.length
        this.totalMines = mine_num
        
        this.STATE_UNOPENED = 13
        this.STATE_FLAG = 14
        this.STATE_MINE_EXPLODED = 15
        this.MAX_NEIGHBOR = 12

        this.board = new Array(this.totalGrid).fill(this.STATE_UNOPENED)
        this.mines = new Array(this.totalGrid).fill(false)
        this.numbers = new Array(this.totalGrid).fill(0)
        
        this.explored = 0
        this.flaggedCount = 0
        this.boomed = 0
        this.win = false
        this.gameOver = false
        this.initialized = false
        this.startTime = 0
    }

    // 第一次点击时部署雷区
    initMines(firstIdx) {
        let safeZone = new Set([firstIdx, ...this.adj[firstIdx]])
        let placedMines = 0
        
        while (placedMines < this.totalMines) {
            let idx = Math.floor(Math.random() * this.totalGrid)
            if (!this.mines[idx] && !safeZone.has(idx)) {
                this.mines[idx] = true
                placedMines++
            }
        }

        // 计算数字
        for (let i = 0; i < this.totalGrid; i++) {
            if (this.mines[i]) continue
            this.numbers[i] = this.adj[i].filter(nIdx => this.mines[nIdx]).length
        }
        this.initialized = true

        this.startTime = Date.now()
    }

    is_openable(idx) {
        return this.board[idx] === this.STATE_UNOPENED || this.board[idx] === this.STATE_FLAG
    }

    is_flagged(idx) {
        return this.board[idx] === this.STATE_FLAG || this.board[idx] === this.STATE_MINE_EXPLODED
    }

    open(idx) {
        if (this.board[idx] === this.STATE_FLAG) {
            this.flaggedCount--
            this.explored--
        }

        if (this.mines[idx]) {
            this.board[idx] = this.STATE_MINE_EXPLODED
            this.explored++
            this.flaggedCount++
            this.boomed++
            this.gameOver = true
            return []
        }

        this.board[idx] = this.numbers[idx]
        this.explored++
        
        if (this.numbers[idx] === 0) {
            return this.adj[idx].filter(nIdx => this.is_openable(nIdx))
        }
        return []
    }

    action(idx, a) {
        if (this.win) return

        // 处理插旗逻辑
        if (a === 'r') {
            if (this.board[idx] === this.STATE_UNOPENED) {
                this.board[idx] = this.STATE_FLAG
                this.flaggedCount++
                this.explored++
            } else if (this.board[idx] === this.STATE_FLAG) {
                this.board[idx] = this.STATE_UNOPENED
                this.flaggedCount--
                this.explored--
            }
        } 
        // 处理翻开逻辑
        else {
            // 第一次点击初始化
            if (!this.initialized) this.initMines(idx)

            let stack = []
            if (this.board[idx] === this.STATE_UNOPENED) {
                stack = [idx]
            } else if (this.board[idx] <= this.MAX_NEIGHBOR) {
                // 和弦逻辑
                let flags = this.adj[idx].filter(nIdx => this.is_flagged(nIdx)).length
                if (this.numbers[idx] === flags) {
                    stack = this.adj[idx].filter(nIdx => this.board[nIdx] === this.STATE_UNOPENED)
                }
            }

            while (stack.length > 0) {
                let currIdx = stack.pop()
                if (!this.is_openable(currIdx)) continue
                let nextToOpen = this.open(currIdx)
                stack.push(...nextToOpen)
            }
        }

        // 胜利判定
        if (this.totalGrid - this.explored + this.flaggedCount === this.totalMines) {
            this.win = true
        }
    }
}

class Game{
    constructor(canvas){
        /** @type {HTMLCanvasElement} */
        this.canvas = canvas
        /** @type {WebGL2RenderingContext} */
        this.gl = this.canvas.getContext("webgl2")
        this.render_data = null
        this.handler = {}
        this.init()
    }
    init(){
        const canvas = this.canvas
        const gl = this.gl

        // canvas样式
        canvas.style.position = "fixed"
        canvas.style.left = canvas.style.top = 0

        // 编译tile绘制着色器
        const shader_v_1 = create_shader(gl, gl.VERTEX_SHADER, shadertext_v_1)
        const shader_f_1 = create_shader(gl, gl.FRAGMENT_SHADER, shadertext_f_1)
        const program_1 = create_program(gl, shader_v_1, shader_f_1)
        gl.useProgram(program_1)
        gl.uniform1i(gl.getUniformLocation(program_1, "tex_state"), 0)
        gl.uniform1i(gl.getUniformLocation(program_1, "tex_number"), 1)

        // 编译背景绘制着色器并准备数据
        const shader_v_0 = create_shader(gl, gl.VERTEX_SHADER, shadertext_v_0)
        const shader_f_0 = create_shader(gl, gl.FRAGMENT_SHADER, shadertext_f_0)
        const program_0 = create_program(gl, shader_v_0, shader_f_0)
        gl.bindVertexArray(null)
        const background_buffer = gl.createBuffer()
        gl.bindBuffer(gl.ARRAY_BUFFER, background_buffer)
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
            -1, -1, 1, -1, 1, 1, -1, 1
        ]), gl.STATIC_DRAW)
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0)
        gl.enableVertexAttribArray(0)

        this.program = [program_0, program_1]

        // 加载数字贴图数据
        const img = new Image()
        img.src = "data:image/svg+xml," + encodeURIComponent(svg)
        img.onload = () => {
            const cvs = document.createElement("canvas")
            const ctx = cvs.getContext("2d")
            const size = 2048
            cvs.width = cvs.height = size
            ctx.translate(0, size)
            ctx.scale(1, -1)
            ctx.drawImage(img, 0, 0, size, size)
            gl.activeTexture(gl.TEXTURE1)
            const texture = gl.createTexture()
            gl.bindTexture(gl.TEXTURE_2D, texture)
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, cvs)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAX_LEVEL, 6)
            gl.generateMipmap(gl.TEXTURE_2D)
            gl.activeTexture(gl.TEXTURE0)

            if(this.render_data !== null){
                this.render_data.update = true
            }
        }

        this.init_event()

        // 每帧更新
        const update = () => {
            requestAnimationFrame(update)
            if(this.render_data === null || !this.render_data.update){
                return
            }
            this.pullback()
            this.render()
            this.render_data.update = false

            //this.render_data.quat = Quat.move_from([0.001, 0.001]).times(this.render_data.quat)
            //this.render_data.update = true
        }
        update()
    }
    init_event(){
        let mouse_action = null
        let mouse_down = false
        let mouse_rotate = false
        let old_mouse_pos_px = [0, 0]

        const clamp_radius = 0.95
        const move_epsilon = 8
        function out_bound(pos){
            return Math.hypot(...pos) > clamp_radius
        }
        function clamp_to_radius(pos){
            const r = Math.hypot(...pos)
            if(r > clamp_radius){
                return [pos[0] / r * clamp_radius, pos[1] / r * clamp_radius]
            }else{
                return pos
            }
        }

        const canvas = this.canvas
        canvas.addEventListener("mousedown", e => {
            e.preventDefault()
            if(this.render_data === null){
                return
            }
            if(this.render_data.minesweeper.win){
                return
            }
            old_mouse_pos_px = [e.offsetX, e.offsetY]
            const pos = this.offset_px_to_disk(old_mouse_pos_px)
            mouse_down = true
            mouse_rotate = out_bound(pos)
            if(e.buttons === 1 && !mouse_rotate){
                mouse_action = "l"
            }else if(e.buttons === 2 && !mouse_rotate){
                mouse_action = "r"
            }else{
                mouse_action = null
            }
            if(mouse_action !== null){
                this.highlight(this.find_tile(pos))
            }else{
                this.highlight(-1)
            }
        })
        canvas.addEventListener("mousemove", e => {
            e.preventDefault()
            if(this.render_data === null){
                return
            }
            if(this.render_data.minesweeper.win){
                mouse_down = false
                return
            }
            if(!mouse_down){
                return
            }
            const new_pos_px = [e.offsetX, e.offsetY]
            if(mouse_action !== null && Math.hypot(new_pos_px[0] - old_mouse_pos_px[0], new_pos_px[1] - old_mouse_pos_px[1]) < move_epsilon){
                return
            }
            this.highlight(-1)
            const render_data = this.render_data
            const new_pos = this.offset_px_to_disk(new_pos_px)
            const old_pos = this.offset_px_to_disk(old_mouse_pos_px)
            if(mouse_rotate){
                const t1 = Math.atan2(new_pos[1], new_pos[0])
                const t0 = Math.atan2(old_pos[1], old_pos[0])
                render_data.quat = Quat.rotate(t1 - t0).times(render_data.quat)
            }else{
                const delta_quat = Quat.move_from_to(clamp_to_radius(old_pos), clamp_to_radius(new_pos))
                render_data.quat = delta_quat.times(render_data.quat)
            }
            old_mouse_pos_px = new_pos_px
            mouse_action = null
            render_data.update = true
        })
        canvas.addEventListener("mouseup", e => {
            e.preventDefault()
            if(this.render_data === null){
                return
            }
            if(this.render_data.minesweeper.win){
                return
            }
            this.highlight(-1)
            if(mouse_action !== null){
                const pos = this.offset_px_to_disk(old_mouse_pos_px)
                const idx = this.find_tile(pos)
                this.action(idx, mouse_action)
            }
            mouse_down = false
            mouse_rotate = false
            mouse_action = null
        })
        canvas.addEventListener("wheel", e => {
            e.preventDefault()
            if(this.render_data === null){
                return
            }
            const render_data = this.render_data
            render_data.scale *= Math.exp(-e.deltaY / 1000)
            render_data.scale = Math.max(0.25, render_data.scale)
            render_data.scale = Math.min(4, render_data.scale)
            render_data.update = true
        })
        canvas.addEventListener("click", e => {
            e.preventDefault()
            if(this.render_data === null){
                return
            }
        })
        canvas.addEventListener("contextmenu", e => {
            e.preventDefault()
            if(this.render_data === null){
                return
            }
        })

        let touch_idx = 0
        let touch_down = false
        let touch_rotate = false
        let touch_static = false

        let old_touch_pos_px = [0, 0]
        let old_touch_dist_px = 0
        function get_touch_dist(t1, t2){
            return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY)
        }
        canvas.addEventListener("touchstart", e => {
            e.preventDefault()
            if(this.render_data === null){
                return
            }
            if(this.render_data.minesweeper.win){
                return
            }
            if (e.touches.length === 1) {
                old_touch_pos_px = [e.touches[0].clientX, e.touches[0].clientY]
                const pos = this.client_px_to_disk(old_touch_pos_px)
                touch_idx += 1
                touch_down = true
                touch_rotate = out_bound(pos)
                touch_static = !touch_rotate
                if(touch_static){
                    this.highlight(this.find_tile(pos))
                    const callback_idx = touch_idx
                    setTimeout(() => {
                        if(touch_idx === callback_idx && touch_down && touch_static && !touch_rotate){
                            touch_down = false
                            touch_static = false
                            this.highlight(-1)
                            const tile_idx = this.find_tile(pos)
                            this.action(tile_idx, "r")
                        }
                    }, 333)
                }
            } else if (e.touches.length === 2) {
                touch_down = false
                touch_static = false
                this.highlight(-1)
                old_touch_dist_px = get_touch_dist(e.touches[0], e.touches[1])
            } else {
                touch_down = false
                touch_static = false
                this.highlight(-1)
            }
        }, {
            passive: false
        })
        canvas.addEventListener("touchmove", e => {
            e.preventDefault()
            if(this.render_data === null){
                return
            }
            if(this.render_data.minesweeper.win){
                return
            }
            const render_data = this.render_data
            if (e.touches.length === 1 && touch_down) {
                const new_touch_pos_px = [e.touches[0].clientX, e.touches[0].clientY]
                const new_pos = this.client_px_to_disk(new_touch_pos_px)
                const old_pos = this.client_px_to_disk(old_touch_pos_px)
                // 长按防止移动
                if(touch_static && Math.hypot(new_touch_pos_px[0] - old_touch_pos_px[0], new_touch_pos_px[1] - old_touch_pos_px[1]) < move_epsilon){
                    return
                }
                if(touch_rotate){
                    const t1 = Math.atan2(new_pos[1], new_pos[0])
                    const t0 = Math.atan2(old_pos[1], old_pos[0])
                    render_data.quat = Quat.rotate(t1 - t0).times(render_data.quat)
                }else{
                    const delta_quat = Quat.move_from_to(clamp_to_radius(old_pos), clamp_to_radius(new_pos))
                    render_data.quat = delta_quat.times(render_data.quat)
                }
                old_touch_pos_px = new_touch_pos_px
            } else if (e.touches.length === 2) {
                const current_dist = get_touch_dist(e.touches[0], e.touches[1])
                if(old_touch_dist_px > 0){
                    const ratio = current_dist / old_touch_dist_px
                    render_data.scale *= ratio
                    render_data.scale = Math.max(0.25, render_data.scale)
                    render_data.scale = Math.min(4, render_data.scale)
                }
                old_touch_dist_px = current_dist
            }
            touch_static = false
            this.highlight(-1)
            render_data.update = true
        }, {
            passive: false
        })

        canvas.addEventListener("touchend", e => {
            e.preventDefault()
            if(this.render_data === null){
                return
            }
            if(this.render_data.minesweeper.win){
                return
            }
            if (e.touches.length === 0) {
                if(touch_down && touch_static){
                    const pos = this.client_px_to_disk(old_touch_pos_px)
                    const tile_idx = this.find_tile(pos)
                    this.action(tile_idx, "l")
                }
                touch_down = false
                touch_rotate = false
                old_touch_dist_px = 0
            } else if (e.touches.length === 1) {
                old_touch_pos_px = [e.touches[0].clientX, e.touches[0].clientY]
                const pos = this.client_px_to_disk(old_touch_pos_px)
                touch_idx += 1
                touch_down = true
                touch_rotate = out_bound(pos)
            } else if(e.touches.length === 2) {
                touch_down = false
                old_touch_dist_px = get_touch_dist(e.touches[0], e.touches[1])
            } else {
                touch_down = false
            }
            touch_static = false
            this.highlight(-1)
        }, {
            passive: false
        })

        canvas.addEventListener("touchcancel", e => {
            touch_down = false
            touch_static = false
            old_touch_dist_px = 0
            this.highlight(-1)
        })


        const resize = () => {
            const width = window.innerWidth
            const height = window.innerHeight
            const resolution = (window.devicePixelRatio || 1)
            const pixel_width = Math.round(width * resolution)
            const pixel_height = Math.round(height * resolution)
            const new_width = pixel_width / resolution
            const new_height = pixel_height / resolution
            canvas.style.width = new_width + "px"
            canvas.style.height = new_height + "px"
            canvas.width = pixel_width
            canvas.height = pixel_height
            if(this.render_data !== null){
                this.render_data.update = true
            }else{
                const gl = this.gl
                gl.viewport(0, 0, canvas.width, canvas.height)
                gl.clearColor(0xf8 / 255, 0xfa / 255, 0xfc / 255, 1)
                gl.clear(gl.COLOR_BUFFER_BIT)
            }
        }
        window.addEventListener("resize", resize)
        window.addEventListener("load", resize)
    }
    offset_px_to_disk(pos_px){
        const [x, y] = pos_px
        const canvas = this.canvas
        const r = this.render_data.scale * Math.min(canvas.width, canvas.height) / 2
        return [
            (x / canvas.clientWidth * canvas.width - canvas.width / 2) / r,
            -(y / canvas.clientHeight * canvas.height - canvas.height / 2) / r
        ]
    }
    client_px_to_disk(pos_px){
        const [x, y] = pos_px
        const canvas = this.canvas
        const r = this.render_data.scale * Math.min(canvas.width, canvas.height) / 2
        const rect = canvas.getBoundingClientRect()
        return [
            ((x - rect.left) / canvas.clientWidth * canvas.width - canvas.width / 2) / r,
            -((y - rect.top) / canvas.clientHeight * canvas.height - canvas.height / 2) / r
        ]
    }
    find_tile(pos){
        const pos_klein = Quat.poincare_to_klein(this.render_data.quat.inv().apply(pos))
        let n = -1
        for(const [vertex, idx] of this.render_data.transformed_polygon){
            n++
            let flag = true
            for(let i = 0; i < vertex.length - 1; i++){
                const v0 = vertex[i]
                const v1 = vertex[i + 1]
                const x1 = v1[0] - v0[0]
                const y1 = v1[1] - v0[1]
                const x2 = pos_klein[0] - v0[0]
                const y2 = pos_klein[1] - v0[1]
                if(x1 * y2 - x2 * y1 < 0){
                    flag = false
                    break
                }
            }
            if(flag){
                return this.render_data.quotient_map[idx]
            }
        }
        return -1
    }
    load(data, mine_num){
        const gl = this.gl

        const {quotient_neighbor, quotient_transform, tile_op, tile_quotient, radius, side} = data

        // 生成图块绘图用数据，包括三角形，双曲变换，对应商空间id
        const edge_division = 4
        const tile_type_num = tile_quotient.length
        const tile_data = []
        for(let i = 0; i < tile_type_num; i++){
            const vao = gl.createVertexArray()
            gl.bindVertexArray(vao)

            const idx_mesh = 0
            const mesh = compute_mesh(radius[i], side[i], edge_division)
            const mesh_data = new Float32Array(mesh.flat())
            const mesh_buffer = gl.createBuffer()
            gl.bindBuffer(gl.ARRAY_BUFFER, mesh_buffer)
            gl.bufferData(gl.ARRAY_BUFFER, mesh_data, gl.STATIC_DRAW)
            gl.vertexAttribPointer(idx_mesh, 2, gl.FLOAT, false, 0, 0)
            gl.enableVertexAttribArray(idx_mesh)

            const idx_quat = 1
            const quat_data = new Float32Array(tile_quotient[i].map(x => x[0].toArray()).flat())
            const quat_buffer = gl.createBuffer()
            gl.bindBuffer(gl.ARRAY_BUFFER, quat_buffer)
            gl.bufferData(gl.ARRAY_BUFFER, quat_data, gl.STATIC_DRAW)
            gl.vertexAttribPointer(idx_quat, 4, gl.FLOAT, false, 0, 0)
            gl.vertexAttribDivisor(idx_quat, 1)
            gl.enableVertexAttribArray(idx_quat)

            const idx_quotient = 2
            const quotient_data = new Int32Array(tile_quotient[i].map(x => x[1]))
            const quotient_buffer = gl.createBuffer()
            gl.bindBuffer(gl.ARRAY_BUFFER, quotient_buffer)
            gl.bufferData(gl.ARRAY_BUFFER, quotient_data, gl.STATIC_DRAW)
            gl.vertexAttribIPointer(idx_quotient, 1, gl.INT, 0, 0)
            gl.vertexAttribDivisor(idx_quotient, 1)
            gl.enableVertexAttribArray(idx_quotient)

            tile_data.push({
                vao,
                radius: radius[i],
                side: side[i],
                mesh_num: mesh.length,
                tile_num: tile_quotient[i].length
            })
        }

        // 生成商空间数字texture
        gl.activeTexture(gl.TEXTURE0)
        const quotient_tex = gl.createTexture()
        gl.bindTexture(gl.TEXTURE_2D, quotient_tex)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)

        // 生成扫雷
        const minesweeper = new Minesweeper(quotient_neighbor, mine_num)
        // 显示用的变换
        const quat = Quat.rotate(Math.random() * 2 * Math.PI).times(Quat.move(Math.random() * 1)).times(Quat.rotate(Math.random() * 2 * Math.PI))
        // 显示用的数字映射到扫雷的数字
        const quotient_num = quotient_neighbor.length
        const quotient_map = new Array(quotient_num).fill(0).map((x, i) => i)

        // 计算多边形的顶点变换之后的klein位置，用于鼠标判定
        const transformed_polygon = []
        for(let i = 0; i < tile_type_num; i++){
            const vertex = compute_mesh(radius[i], side[i], 1).slice(1)
            for(let j = 0; j < tile_quotient[i].length; j++){
                const [tile_quat, tile_idx] = tile_quotient[i][j]
                const tile_vertex = vertex.map(x => Quat.poincare_to_klein(tile_quat.apply(x)))
                const tile_dist = Math.hypot(...tile_quat.center())
                transformed_polygon.push([tile_vertex, tile_idx, tile_dist])
            }
        }
        
        transformed_polygon.sort((a, b) => a[2] - b[2])
        transformed_polygon.forEach(x => x.pop())


        this.render_data = {
            tile_data,
            border: 0.08,
            tile_op,
            quotient_transform,
            transformed_polygon,

            scale: 0.94,
            quat,
            quotient_map,
            highlight: -1,
            minesweeper,
            update: true,
        }

        this.update_number()
    }
    pullback(){
        // 把变换拉回到中心，同时更新数字
        const anchor = this.render_data.anchor || [0.02, 0.01]
        let quat = null
        let map = null
        let min = Math.hypot(...this.render_data.quat.apply(anchor))
        for(let i = 0; i < this.render_data.tile_op.length; i++){
            const op = this.render_data.tile_op[i]
            const new_quat = this.render_data.quat.times(op)
            const new_val = Math.hypot(...new_quat.apply(anchor))
            if(new_val < min){
                min = new_val
                quat = new_quat
                map = this.render_data.quotient_transform[i]
            }
        }
        if(quat !== null){
            this.render_data.quat = quat
            this.render_data.quotient_map = map.map(x => this.render_data.quotient_map[x])
            this.update_number()
        }
    }
    highlight(idx){
        if(this.render_data.highlight === idx){
            return
        }
        this.render_data.highlight = idx
        this.update_number()
    }
    action(idx, a){
        const minesweeper = this.render_data.minesweeper
        const prev_win = minesweeper.win
        const prev_fail = minesweeper.gameOver

        minesweeper.action(idx, a)
        this.update_number()

        if(this.handler.update){
            this.handler.update()
        }

        if(minesweeper.win && !prev_win){
            if(this.handler.end){
                this.handler.end()
            }
        }else if(minesweeper.gameOver && !prev_fail){
            if(this.handler.fail){
                this.handler.fail()
            }
        }
    }
    update_number(){
        // 更新显示的数字
        const gl = this.gl
        const minesweeper = this.render_data.minesweeper
        const idx = this.render_data.highlight
        const lst = []
        const idx_state = minesweeper.board[idx]
        if(idx_state > minesweeper.MAX_NEIGHBOR){
            lst.push(idx)
        }else if(idx_state > 0){
            lst.push(...minesweeper.adj[idx].filter(x => minesweeper.board[x] > minesweeper.MAX_NEIGHBOR))
        }
        const quotient_number = this.render_data.quotient_map.map(x => lst.includes(x) ? minesweeper.board[x] | 0x10 : minesweeper.board[x])
        const quotient_num = this.render_data.quotient_map.length
        gl.activeTexture(gl.TEXTURE0)
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32I, quotient_num, 1, 0, gl.RED_INTEGER, gl.INT, new Int32Array(quotient_number))
        this.render_data.update = true
    }
    render(){
        const canvas = this.canvas
        const gl = this.gl
        const [program_0, program_1] = this.program
        gl.viewport(0, 0, canvas.width, canvas.height)
        gl.useProgram(program_0)
        gl.uniform3f(gl.getUniformLocation(program_0, "u_resolution_half"), 0.5 * canvas.width, 0.5 * canvas.height, 0.5 * this.render_data.scale * Math.min(canvas.width, canvas.height))
        gl.bindVertexArray(null)
        gl.drawArrays(gl.TRIANGLE_FAN, 0, 4)
        gl.useProgram(program_1)
        gl.uniform3f(gl.getUniformLocation(program_1, "u_resolution"), canvas.width, canvas.height, this.render_data.scale * Math.min(canvas.width, canvas.height))
        gl.uniform4fv(gl.getUniformLocation(program_1, "u_quat"), this.render_data.quat.toArray())
        for(const data of this.render_data.tile_data){
            const t = Math.tanh((data.radius - this.render_data.border / 2) / 2)
            gl.uniform2f(gl.getUniformLocation(program_1, "u_param"), Math.PI * 2 / data.side, t)
            gl.bindVertexArray(data.vao)
            gl.drawArraysInstanced(gl.TRIANGLE_FAN, 0, data.mesh_num, data.tile_num)
        }
    }
}

</div>

<div class="panel hide" id="fail">
<h1>呜哇！爆炸了！</h1>
<button class="btn" id="resume">继续游戏</button>
<button class="btn" id="new1">新游戏</button>
</div>

<div class="panel hide" id="win">
<h1 id="winTitle"></h1>
<ul class="guide" id="stats"></ul>
<button class="btn" id="new2">新游戏</button>
</div>



<script>
const menu = document.getElementById("menu")
const failPanel = document.getElementById("fail")
const winPanel = document.getElementById("win")
const winTitle = document.getElementById("winTitle")
const stats = document.getElementById("stats")
const sizeSel = document.getElementById("size")
const mineInput = document.getElementById("mines")
const progressEl = document.getElementById("progress")

const hideAll = () => {
    menu.classList.add("hide")
    failPanel.classList.add("hide")
    winPanel.classList.add("hide")
}

function updateProgressVisibility(){
    const show = menu.classList.contains("hide") && winPanel.classList.contains("hide")
    progressEl.classList.toggle("hide", !show)
}

function update_progress(flagged, total){
    progressEl.textContent = `进度：${flagged}/${total}`
}

data.forEach((d, i) => sizeSel.add(new Option(String(d.size), i)))

function syncMines(){
    const d = data[+sizeSel.value]
    const max = Math.floor(d.size / 2)
    mineInput.min = 1
    mineInput.max = max
    mineInput.value = d.default
    mineInput.classList.remove("invalid")
}

function normalizeMines(){
    const d = data[+sizeSel.value]
    const max = Math.floor(d.size / 2)
    let v = parseInt(mineInput.value, 10)
    if(isNaN(v)) v = d.default
    v = Math.max(1, Math.min(max, v))
    mineInput.value = v
    mineInput.classList.remove("invalid")
    return v
}

sizeSel.addEventListener("change", syncMines)
mineInput.addEventListener("blur", normalizeMines)
mineInput.addEventListener("change", normalizeMines)
syncMines()
updateProgressVisibility()

let failedShown = false
let wonShown = false

// 点击开始游戏按钮后隐藏卡片并运行
function start_game(idx, mine_num){
    hideAll()
    failedShown = false
    wonShown = false
    update_progress(0, mine_num)
    updateProgressVisibility()
    const data_4466 = compute_4466(data[idx].generator)
    game.load(data_4466, mine_num)
}

// 失败卡片：继续游戏 / 新游戏
function show_fail(){
    failPanel.classList.remove("hide")
    updateProgressVisibility()
}

// 成功卡片：标题、尺寸、雷数、爆炸、用时通过参数传递
function show_end(title, size, mines, boom, time){
    winTitle.textContent = title
    const rows = [
        ["大小", size],
        ["雷数", mines],
        ["爆炸", boom],
        ["用时", time + "s"]
    ]
    stats.innerHTML = ""
    rows.forEach(([k, v]) => {
        const li = document.createElement("li")
        li.textContent = k + "：" + v
        stats.appendChild(li)
    })
    winPanel.classList.remove("hide")
    updateProgressVisibility()
}

document.getElementById("start").addEventListener("click", () => {
    start_game(+sizeSel.value, normalizeMines())
})

document.getElementById("resume").addEventListener("click", () => {
    failPanel.classList.add("hide")
    updateProgressVisibility()
})

document.getElementById("new1").addEventListener("click", () => {
    hideAll()
    menu.classList.remove("hide")
    updateProgressVisibility()
})

document.getElementById("new2").addEventListener("click", () => {
    hideAll()
    menu.classList.remove("hide")
    updateProgressVisibility()
})

game.handler.end = () => {
    const minesweeper = game.render_data.minesweeper
    const time = ((Date.now() - minesweeper.startTime) / 1000).toFixed(2)
    const total = minesweeper.totalGrid
    const mines = minesweeper.totalMines
    const boomed = minesweeper.boomed
    setTimeout(() => {
        show_end(boomed === 0 ? "完美通关" : "游戏完成", total, mines, boomed, time)
    }, 333)
}

game.handler.fail = () => {
    setTimeout(() => {
        show_fail()
    }, 333)
}

game.handler.update = () => {
    const minesweeper = game.render_data.minesweeper
    update_progress(minesweeper.flaggedCount, minesweeper.totalMines)
}
</script>

</body>
</html>
